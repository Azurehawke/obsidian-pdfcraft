name: CI

# Type-checks the plugin on every push and pull request (the release workflow builds PdfCraft).
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
